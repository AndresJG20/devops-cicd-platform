apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploylab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploylab
  template:
    metadata:
      labels:
        app: deploylab
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: deploylab:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
